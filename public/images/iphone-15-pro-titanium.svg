<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A968D" />
      <stop offset="50%" stop-color="#6A665E" />
      <stop offset="100%" stop-color="#3A3732" />
    </linearGradient>
    <linearGradient id="titaniumBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A4742" />
      <stop offset="100%" stop-color="#23221F" />
    </linearGradient>
    <filter id="proShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <circle cx="200" cy="240" r="150" fill="#E50914" opacity="0.12" filter="blur(40px)"/>

  <!-- Phone Body Back View / Isometric Hybrid -->
  <rect x="85" y="45" width="230" height="410" rx="40" fill="url(#titaniumBack)" stroke="url(#titaniumGrad)" stroke-width="4" filter="url(#proShadow)"/>

  <!-- Triple Camera Plateau Glass -->
  <rect x="105" y="65" width="115" height="115" rx="26" fill="#2E2C28" stroke="#5A564E" stroke-width="1.5"/>

  <!-- Camera Lenses with Metallic Rings -->
  <!-- Top Left Lens -->
  <circle cx="138" cy="98" r="22" fill="#151413" stroke="#8A857B" stroke-width="3"/>
  <circle cx="138" cy="98" r="14" fill="#090808" stroke="#3A3834" stroke-width="1.5"/>
  <circle cx="134" cy="94" r="5" fill="#4A6572" opacity="0.8"/>

  <!-- Bottom Left Lens -->
  <circle cx="138" cy="148" r="22" fill="#151413" stroke="#8A857B" stroke-width="3"/>
  <circle cx="138" cy="148" r="14" fill="#090808" stroke="#3A3834" stroke-width="1.5"/>
  <circle cx="134" cy="144" r="5" fill="#4A6572" opacity="0.8"/>

  <!-- Right Lens -->
  <circle cx="188" cy="123" r="22" fill="#151413" stroke="#8A857B" stroke-width="3"/>
  <circle cx="188" cy="123" r="14" fill="#090808" stroke="#3A3834" stroke-width="1.5"/>
  <circle cx="184" cy="119" r="5" fill="#4A6572" opacity="0.8"/>

  <!-- Flash & LiDAR -->
  <circle cx="188" cy="80" r="7" fill="#FFFBEA" stroke="#B5AF9E" stroke-width="1"/>
  <circle cx="188" cy="165" r="5" fill="#1A1918"/>

  <!-- Apple Logo -->
  <g transform="translate(182, 230)">
    <path d="M 18.5 12 C 18.5 7.5 22.2 5.2 22.4 5.1 C 20.3 2.1 17.1 1.7 16 1.6 C 13.3 1.3 10.7 3.2 9.3 3.2 C 7.9 3.2 5.8 1.6 3.6 1.6 C 0.7 1.6 -1.8 3.3 -3.3 5.9 C -6.3 11.2 -4 19.1 -1.1 23.3 C 0.3 25.3 1.9 27.6 4.1 27.5 C 6.2 27.4 7 26.1 9.5 26.1 C 12 26.1 12.7 27.5 14.9 27.5 C 17.2 27.4 18.6 25.4 20 23.3 C 21.6 21 22.3 18.7 22.4 18.6 C 22.3 18.5 18.5 17.1 18.5 12 Z" fill="#8A857B" opacity="0.6"/>
    <path d="M 12.4 -2 C 13.6 -3.5 14.4 -5.5 14.1 -7.6 C 12.4 -7.5 10.3 -6.4 9.1 -5 C 8 -3.7 7 -1.6 7.3 0.4 C 9.2 0.5 11.2 -0.6 12.4 -2 Z" fill="#8A857B" opacity="0.6"/>
  </g>

  <!-- Model Badge text -->
  <text x="200" y="410" font-family="sans-serif" font-weight="800" font-size="13" fill="#D4CEBE" text-anchor="middle" letter-spacing="2">iPhone 15 Pro</text>
  <text x="200" y="428" font-family="sans-serif" font-weight="600" font-size="10" fill="#E50914" text-anchor="middle" letter-spacing="1">NATURAL TITANIUM</text>
</svg>
