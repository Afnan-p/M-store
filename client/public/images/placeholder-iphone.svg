<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111115" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Subtle ambient red glow behind device -->
  <circle cx="200" cy="230" r="140" fill="url(#glowRed)" />
  
  <!-- Phone Outer Chassis -->
  <rect x="90" y="40" width="220" height="420" rx="36" fill="url(#bodyGrad)" stroke="#3F3F46" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Screen Frame -->
  <rect x="100" y="50" width="200" height="400" rx="28" fill="url(#screenGrad)" stroke="#27272A" stroke-width="1.5"/>
  
  <!-- Dynamic Island -->
  <rect x="165" y="62" width="70" height="18" rx="9" fill="#000000" stroke="#18181B" stroke-width="1"/>
  <circle cx="178" cy="71" r="3.5" fill="#09090B"/>
  <circle cx="218" cy="71" r="2.5" fill="#0D0D12"/>

  <!-- Wallpaper Graphic - Apple style gradient waves -->
  <path d="M100 280 C 140 240, 200 320, 300 250 L 300 450 L 100 450 Z" fill="#E50914" opacity="0.15"/>
  <path d="M100 320 C 180 290, 220 380, 300 310 L 300 450 L 100 450 Z" fill="#E50914" opacity="0.25"/>

  <!-- Brand logo mark -->
  <g transform="translate(182, 220)">
    <path d="M 18.5 12 C 18.5 7.5 22.2 5.2 22.4 5.1 C 20.3 2.1 17.1 1.7 16 1.6 C 13.3 1.3 10.7 3.2 9.3 3.2 C 7.9 3.2 5.8 1.6 3.6 1.6 C 0.7 1.6 -1.8 3.3 -3.3 5.9 C -6.3 11.2 -4 19.1 -1.1 23.3 C 0.3 25.3 1.9 27.6 4.1 27.5 C 6.2 27.4 7 26.1 9.5 26.1 C 12 26.1 12.7 27.5 14.9 27.5 C 17.2 27.4 18.6 25.4 20 23.3 C 21.6 21 22.3 18.7 22.4 18.6 C 22.3 18.5 18.5 17.1 18.5 12 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M 12.4 -2 C 13.6 -3.5 14.4 -5.5 14.1 -7.6 C 12.4 -7.5 10.3 -6.4 9.1 -5 C 8 -3.7 7 -1.6 7.3 0.4 C 9.2 0.5 11.2 -0.6 12.4 -2 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- M Store Watermark -->
  <text x="200" y="380" font-family="sans-serif" font-weight="900" font-size="14" fill="#ffffff" opacity="0.6" text-anchor="middle" letter-spacing="3">M STORE</text>
  <text x="200" y="398" font-family="sans-serif" font-weight="600" font-size="10" fill="#E50914" opacity="0.8" text-anchor="middle" letter-spacing="1">QUALITY CHECKED</text>
</svg>
