<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C20" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>
    <linearGradient id="glassGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A42" />
      <stop offset="100%" stop-color="#1A1A20" />
    </linearGradient>
    <filter id="glow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark studio background -->
  <rect width="600" height="400" fill="url(#bgGrad1)"/>
  
  <!-- Subtle red atmospheric glow -->
  <circle cx="200" cy="180" r="180" fill="#E50914" opacity="0.08" filter="blur(50px)"/>

  <!-- Extreme Close-up Pro Triple Camera Module -->
  <g transform="translate(140, -10) scale(1.4)">
    <!-- Phone Back Body Contour -->
    <path d="M 0 50 Q 0 0 50 0 L 300 0 C 320 0 330 10 330 30 L 330 300 C 330 320 320 330 300 330 L 50 330 Q 0 330 0 280 Z" fill="#252529" stroke="#4A4A54" stroke-width="3" filter="url(#glow1)"/>

    <!-- Glass Camera Plateau -->
    <rect x="30" y="30" width="160" height="160" rx="36" fill="url(#glassGrad1)" stroke="#5A5A66" stroke-width="2"/>

    <!-- Lens 1 (Top Left) -->
    <circle cx="75" cy="75" r="32" fill="#0C0C0E" stroke="#8E8E9B" stroke-width="4"/>
    <circle cx="75" cy="75" r="22" fill="#050506" stroke="#444450" stroke-width="2"/>
    <circle cx="70" cy="70" r="8" fill="#4B6B94" opacity="0.7"/>

    <!-- Lens 2 (Bottom Left) -->
    <circle cx="75" cy="145" r="32" fill="#0C0C0E" stroke="#8E8E9B" stroke-width="4"/>
    <circle cx="75" cy="145" r="22" fill="#050506" stroke="#444450" stroke-width="2"/>
    <circle cx="70" cy="140" r="8" fill="#4B6B94" opacity="0.7"/>

    <!-- Lens 3 (Right Center) -->
    <circle cx="145" cy="110" r="32" fill="#0C0C0E" stroke="#8E8E9B" stroke-width="4"/>
    <circle cx="145" cy="110" r="22" fill="#050506" stroke="#444450" stroke-width="2"/>
    <circle cx="140" cy="105" r="8" fill="#4B6B94" opacity="0.7"/>

    <!-- True Tone Flash & LiDAR -->
    <circle cx="145" cy="50" r="10" fill="#FFFBE6" stroke="#999488" stroke-width="1.5"/>
    <circle cx="145" cy="170" r="8" fill="#151518"/>
  </g>
</svg>
