<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chargerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect x="110" y="120" width="180" height="220" rx="30" fill="url(#chargerGrad)" stroke="#D4D4D8" stroke-width="2" filter="url(#cShadow)"/>
  <!-- Prongs -->
  <rect x="155" y="60" width="22" height="60" rx="4" fill="#A1A1AA"/>
  <rect x="223" y="60" width="22" height="60" rx="4" fill="#A1A1AA"/>
  <!-- USB-C Port -->
  <rect x="160" y="300" width="80" height="20" rx="10" fill="#27272A" stroke="#71717A" stroke-width="2"/>
  <rect x="175" y="306" width="50" height="8" rx="4" fill="#09090B"/>
  <text x="200" y="410" font-family="sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">Apple 20W Charger</text>
  <text x="200" y="428" font-family="sans-serif" font-weight="600" font-size="10" fill="#E50914" text-anchor="middle" letter-spacing="1">ORIGINAL ACCESSORY</text>
</svg>
